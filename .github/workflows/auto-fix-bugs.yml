name: Auto-fix triaged bugs (Improvements board)

# Picks up at most one bug report per run that the Improvements board's
# classification sweep has already labeled kind=bug, status=triaged, and
# investigates/fixes/pushes the fix directly to main - see
# auto-fix-prompt.md for exactly what it's told to do (and when it's told
# to back off instead of guessing). Per explicit instruction, this pushes
# straight to main - Railway auto-deploys from main on every push, so a
# pushed fix here reaches production with no human review step at all.
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  auto-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure git identity
        run: |
          git config user.name "heyphil-auto-fix[bot]"
          git config user.email "actions@users.noreply.github.com"

      - name: Auto-fix one triaged bug (if any)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          claude -p "$(cat .github/workflows/auto-fix-prompt.md)" \
            --permission-mode bypassPermissions \
            --output-format text
