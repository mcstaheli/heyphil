name: Auto-fix triaged bugs (Improvements board)

# Once a day, picks up at most one bug report that the Improvements
# board's classification sweep has already labeled kind=bug, status=triaged
# - see auto-fix-implement-prompt.md for exactly what it's told to do (and
# when it's told to back off instead of guessing).
#
# Three gates, in order, all of which have to pass before anything reaches
# main: (1) phase-1 Claude Code run implements a fix and runs npm test,
# (2) npm run smoke boots the fixed server against the real DB, (3) a
# SEPARATE, independent phase-2 Claude Code run (no memory of phase 1)
# adversarially reviews the actual diff and re-runs the tests itself.
# Only if all three approve does the deterministic finalize step commit
# and push straight to main - Railway auto-deploys from main on every
# push, so this is the only step that can put a change in front of real
# users, and it's the one step with zero LLM judgment left in it.
on:
  schedule:
    - cron: '38 15 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  auto-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure git identity
        run: |
          git config user.name "heyphil-auto-fix[bot]"
          git config user.email "actions@users.noreply.github.com"

      - name: "Phase 1: implement a fix (or back off)"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          claude -p "$(cat .github/workflows/auto-fix-implement-prompt.md)" \
            --permission-mode bypassPermissions \
            --output-format text

      - name: Check phase 1's outcome
        id: check
        run: |
          if [ ! -f .auto-fix-state.json ]; then
            echo "attempted=false" >> "$GITHUB_OUTPUT"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ATTEMPTED=$(node -p "require('./.auto-fix-state.json').attempted === true")
          CONFIDENT=$(node -p "(() => { try { return require('./.auto-fix-state.json').confident === true } catch { return false } })()")
          echo "attempted=$ATTEMPTED" >> "$GITHUB_OUTPUT"
          if [ "$ATTEMPTED" = "true" ] && [ "$CONFIDENT" = "true" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Record a low-confidence back-off
        if: steps.check.outputs.attempted == 'true' && steps.check.outputs.proceed == 'false'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          IMPROVEMENT_ID=$(node -p "require('./.auto-fix-state.json').improvementId")
          REASON=$(node -p "require('./.auto-fix-state.json').backOffReason || 'no reason given'")
          node scripts/auto-fix/finalize.mjs "$IMPROVEMENT_ID" rejected "$REASON"

      - name: Smoke test the fix
        id: smoke
        if: steps.check.outputs.proceed == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if npm run smoke; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: "Phase 2: independent adversarial review"
        if: steps.check.outputs.proceed == 'true' && steps.smoke.outputs.passed == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          claude -p "$(cat .github/workflows/auto-fix-verify-prompt.md)" \
            --permission-mode bypassPermissions \
            --output-format text

      - name: Finalize (commit + push if approved, discard + note otherwise)
        if: steps.check.outputs.proceed == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          COMMIT_URL_BASE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          IMPROVEMENT_ID=$(node -p "require('./.auto-fix-state.json').improvementId")

          if [ "${{ steps.smoke.outputs.passed }}" != "true" ]; then
            git checkout -- .
            git clean -fd
            node scripts/auto-fix/finalize.mjs "$IMPROVEMENT_ID" rejected "smoke test failed against the fixed server - see this workflow run's logs"
            exit 0
          fi

          VERDICT=$(node -p "(() => { try { return require('./.auto-fix-state.json').verdict || 'reject' } catch { return 'reject' } })()")
          REASON=$(node -p "(() => { try { return require('./.auto-fix-state.json').verdictReason || 'no reason given' } catch { return 'no reason given' } })()")

          if [ "$VERDICT" = "approve" ]; then
            git add -A
            git commit -m "Auto-fix: improvement ${IMPROVEMENT_ID}

${REASON}

🤖 Generated with Claude Code (auto-fix workflow) - Improvements board item ${IMPROVEMENT_ID}"
            git pull --rebase origin main
            git push origin main
            COMMIT_URL="${COMMIT_URL_BASE}/commit/$(git rev-parse HEAD)"
            node scripts/auto-fix/finalize.mjs "$IMPROVEMENT_ID" shipped "$COMMIT_URL"
          else
            git checkout -- .
            git clean -fd
            node scripts/auto-fix/finalize.mjs "$IMPROVEMENT_ID" rejected "$REASON"
          fi
